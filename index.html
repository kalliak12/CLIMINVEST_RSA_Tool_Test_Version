<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CLIMINVEST Replication Suitability Assessment (RSA) — team assessment workspace" />
    <title>CLIMINVEST RSA</title>
    <link rel="icon" type="image/png" href="images/climinvest-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Application navigation">
            <div class="brand">
                <img src="images/climinvest-logo.png" alt="Climinvest" class="brand-logo" />
                <span>Replication Suitability Assessment</span>
            </div>

            <div class="assessment-switch">
                <label for="assessmentSelect">Assessment</label>
                <select id="assessmentSelect"></select>
                <button id="newAssessmentBtn" class="link-button side-link" type="button">+ New assessment</button>
            </div>

            <nav id="nav" class="nav-list" aria-label="Sections"></nav>

            <div class="sidebar-actions">
                <label class="button primary file-button import-main" title="Import an RSA Excel workbook or a JSON file">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span>Import Excel or JSON</span>
                    <input id="importInput" type="file" accept="application/json,.json,.xlsx,.xlsm,.xls,.ods,.csv" />
                </label>
                <p class="side-group">Files</p>
                <button id="exportXlsxBtn" class="side-item" type="button" title="A workbook in the RSA Scoring Toolkit layout: keep it, share it, edit it in Excel and import it again"><span class="side-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg></span><span class="side-txt"><b>Export Excel</b><small>To share or edit in Excel</small></span></button>
                <button id="exportBtn" class="side-item" type="button" title="An exact copy of this assessment (including history) to restore it later"><span class="side-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4c-2 0-2 2-2 4s-1 4-3 4c2 0 3 2 3 4s0 4 2 4M15 4c2 0 2 2 2 4s1 4 3 4c-2 0-3 2-3 4s0 4-2 4"/></svg><i class="side-dot" id="backupDot" hidden></i></span><span class="side-txt"><b>Export JSON</b><small>Exact backup, with history</small></span></button>
                <div id="backupHint" class="backup-hint" role="status" hidden><span class="backup-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg></span><span><b id="backupHintTitle">Changes not saved to a file</b><small id="backupHintText"></small></span></div>
                <p class="side-group">Help &amp; account</p>
                <button id="feedbackBtn" class="side-item" type="button" title="Tell the RSA team what worked, what did not, or what was unclear"><span class="side-ic blue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span class="side-txt"><b>Send feedback</b><small>Tell us what to improve</small></span></button>
                <button id="signOutBtn" class="side-item" type="button" hidden><span class="side-ic grey"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg></span><span class="side-txt"><b>Sign out</b><small id="signedInAs">Signed in</small></span></button>
                <p class="side-group">Delete</p>
                <button id="deleteAssessmentBtn" class="side-item danger" type="button" title="Delete only the assessment that is open now"><span class="side-ic red"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></span><span class="side-txt"><b>Delete this assessment</b><small>Only the one open now</small></span></button>
                <button id="resetBtn" class="side-item danger" type="button"><span class="side-ic red"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></span><span class="side-txt"><b id="resetLabel">Reset demo data</b><small>All assessments and imports</small></span></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-title">
                    <p class="eyebrow">Replication Suitability Assessment</p>
                    <h1 id="pageTitle">Dashboard</h1>
                    <p id="pairLine" class="pair-line"></p>
                </div>
                <div class="status-cluster">
                    <label class="acting-as">Acting as<select id="actingAs" aria-label="Acting as team member"></select></label>
                    <span id="saveStatus" class="save-status">Saved</span>
                    <button id="aiToggle" class="button secondary" type="button">Assistant</button>
                    <button id="printBtn" class="button secondary" type="button">Print report</button>
                </div>
            </header>
            <div id="globalAlerts" class="global-alerts"></div>
            <div id="viewRoot"></div>
        </main>
    </div>

    <aside id="aiPanel" class="ai-panel" aria-hidden="true" aria-label="Assessment assistant">
        <header class="ai-head">
            <h2>Assistant</h2>
            <div class="button-row">
                <button id="aiClear" class="link-button small" type="button">Clear</button>
                <button id="aiClose" class="icon-button" type="button" aria-label="Close assistant">×</button>
            </div>
        </header>
        <p class="ai-disclaimer">Helps you find gaps, compare projects and draft text. It never scores or approves. <span id="aiProvider" hidden></span></p>
        <label class="ai-context">About<select id="aiMetric"></select></label>
        <div id="aiQuick" class="ai-quick"></div>
        <div id="aiLog" class="ai-log" aria-live="polite"></div>
        <form id="aiForm" class="ai-form">
            <label class="ai-attach" title="Attach files to the Evidence log" aria-label="Attach files">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
                <input type="file" id="aiFile" multiple hidden />
            </label>
            <textarea id="aiInput" rows="2" placeholder="Ask a question, or drop a file here…"></textarea>
            <button class="button primary" type="submit">Ask</button>
        </form>
    </aside>

    <input type="file" id="dataFileInput" accept=".xlsx,.xlsm,.xls,.ods,.csv" hidden />
    <input type="file" id="excelProjectsInput" accept=".xlsx,.xlsm,.xls,.ods" multiple hidden />
    <dialog id="modal"></dialog>
    <div id="toastHost" class="toast-host" aria-live="polite"></div>

    <script src="js/config/edition.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/config/methodology.js"></script>
    <script src="js/data/pdm-mock-data.js"></script>
    <script src="js/data/recommendation-catalogue.js"></script>
    <script src="js/data/resources.js"></script>
    <script src="js/services/storage.js"></script>
    <script src="js/config/pdm-mapping.js"></script>
    <script src="js/services/pdm-service.js"></script>
    <script src="js/services/pdm-climinvest.js"></script>
    <script src="js/services/excel-import.js"></script>
    <script src="js/services/data-extract.js"></script>
    <script src="js/services/excel-projects.js"></script>
    <script src="js/core/indicators.js"></script>
    <script src="js/core/data.js"></script>
    <script src="js/core/model.js"></script>
    <script src="js/core/scoring.js"></script>
    <script src="js/core/workflow.js"></script>
    <script src="js/core/recommendations.js"></script>
    <script src="js/core/sensitivity.js"></script>
    <script src="js/data/demo-assessment.js"></script>
    <script src="js/services/ai-service.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui/data-import.js"></script>
    <script src="js/ui/feedback.js"></script>
    <script src="js/ui/import-report.js"></script>
    <script src="js/ui/login.js"></script>
    <script src="js/services/excel-export.js"></script>
    <script src="js/ui/views/dashboard.js"></script>
    <script src="js/ui/views/projects.js"></script>
    <script src="js/ui/views/team.js"></script>
    <script src="js/ui/views/screening.js"></script>
    <script src="js/ui/views/assessment.js"></script>
    <script src="js/ui/views/evidence.js"></script>
    <script src="js/ui/views/risks.js"></script>
    <script src="js/ui/views/recommendations.js"></script>
    <script src="js/ui/views/report.js"></script>
    <script src="js/ui/views/about.js"></script>
    <script src="js/ui/ai-panel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
